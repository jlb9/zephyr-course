CONFIG_CPP=y
CONFIG_ZTEST=y
CONFIG_COVERAGE=y
CONFIG_SPIN_VALIDATE=n  # needed so it can be compiled for native_sim : On native_sim, CONFIG_ZTEST enables CONFIG_SPIN_VALIDATE by default. This checks that a spinlock's memory address falls within Zephyr's simulated kernel memory space. A circularBuffer declared as a local variable in a test function lives on the native Linux stack (address 0xf7c412c8), which is outside Zephyr's address space — hence "Invalid spinlock". This is actually a useful guard: in real embedded code, you'd never put a kernel object on the stack either.
